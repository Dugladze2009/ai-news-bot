name: AI News → Discord

on:
  schedule:
    - cron: "55 17 * * *"    # ყოველდღე 21:55 საქართველოს დროით (GitHub-ის დაყოვნების გათვალისწინებით ~22:00)
    - cron: "35 18 * * *"    # 22:35 — სათადარიგო: თუ რამე გამოტოვდა (Gemini დაკავებული იყო)
  workflow_dispatch:          # ხელით გაშვება GitHub-იდან
    inputs:
      test_url:
        description: "ტესტი: ჩასვი ერთი სტატიის ლინკი (ცარიელი = ჩვეულებრივი გაშვება)"
        required: false
        default: ""
      daily:
        description: "დღის სიახლეები სათაურით (1 = კი)"
        required: false
        default: "0"
      backfill_days:
        description: "ბოლო რამდენი დღის სიახლეები დაიპოსტოს (0 = ჩვეულებრივი გაშვება)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch & post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PING_ROLE_ID: ${{ vars.PING_ROLE_ID }}
          FORUM_CHANNEL: ${{ vars.FORUM_CHANNEL }}
          FULL_ARTICLE: ${{ vars.FULL_ARTICLE || '0' }}
          TEST_URL: ${{ github.event.inputs.test_url }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
          MAX_POSTS_PER_RUN: "40"
          MAX_AGE_DAYS: "1.5"
          DAILY_HEADER: ${{ (github.event.schedule == '55 17 * * *' || github.event.inputs.daily == '1') && '1' || '0' }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          cp seen.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python merge_state.py "$RUNNER_TEMP/mine.json" seen.json seen.json
            git add seen.json
            git diff --cached --quiet && exit 0
            git commit -q -m "update seen.json"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
