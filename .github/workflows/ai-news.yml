name: AI News → Discord

on:
  schedule:
    - cron: "*/15 * * * *"   # ყოველ 15 წუთში
  workflow_dispatch:          # ხელით გაშვება GitHub-იდან
    inputs:
      test_url:
        description: "ტესტი: ჩასვი ერთი სტატიის ლინკი (ცარიელი = ჩვეულებრივი გაშვება)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch & post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PING_ROLE_ID: ${{ vars.PING_ROLE_ID }}
          FORUM_CHANNEL: ${{ vars.FORUM_CHANNEL }}
          FULL_ARTICLE: ${{ vars.FULL_ARTICLE || '0' }}
          TEST_URL: ${{ github.event.inputs.test_url }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen.json" && git pull --rebase -q && git push)
