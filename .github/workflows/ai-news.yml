name: AI News → Discord

on:
  schedule:
    - cron: "55 5 * * *"     # ყოველდღე 09:55 საქართველოს დროით (GitHub-ის დაყოვნების გათვალისწინებით ~10:00)
    - cron: "35 6 * * *"     # 10:35 — სათადარიგო: თუ რამე გამოტოვდა (Gemini დაკავებული იყო)
  workflow_dispatch:          # ხელით გაშვება GitHub-იდან
    inputs:
      test_url:
        description: "ტესტი: ჩასვი ერთი სტატიის ლინკი (ცარიელი = ჩვეულებრივი გაშვება)"
        required: false
        default: ""
      backfill_days:
        description: "ბოლო რამდენი დღის სიახლეები დაიპოსტოს (0 = ჩვეულებრივი გაშვება)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch & post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PING_ROLE_ID: ${{ vars.PING_ROLE_ID }}
          FORUM_CHANNEL: ${{ vars.FORUM_CHANNEL }}
          FULL_ARTICLE: ${{ vars.FULL_ARTICLE || '0' }}
          TEST_URL: ${{ github.event.inputs.test_url }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
          MAX_POSTS_PER_RUN: "40"
          MAX_AGE_DAYS: "1.5"
          DAILY_HEADER: ${{ github.event.schedule == '55 5 * * *' && '1' || '0' }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "ai-news-bot"
          git config user.email "ai-news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen.json" && git pull --rebase -q && git push)
